const full = it => it[2] + ' ' + STYLE + ' ' + (it[3] || PORTRAIT);
document.getElementById('styleText').textContent = INTRO;
const list = document.getElementById('list'), chips = document.getElementById('chips'); let cur = 'all';
function draw() {
  chips.innerHTML = [['전체', 'all']].concat(G.map(g => [g[0] + ' ' + g[2].length, g[1]])).map(([n, k]) => '<button data-f="' + k + '" class="' + (k === cur ? 'on' : '') + '">' + n + '</button>').join('');
  list.innerHTML = G.filter(g => cur === 'all' || g[1] === cur).map(g => '<h2>' + g[0] + '</h2>' + g[2].map((it, i) => '<div class="item"><div><h3>' + it[0] + '<small>' + it[1] + '</small></h3><p>' + it[2] + '</p></div><button data-copy="' + g[1] + ':' + i + '">복사</button></div>').join('')).join('');
}
draw();
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { cur = f.dataset.f; draw(); return; }
  const b = e.target.closest('[data-copy]'); if (!b) return;
  let text; if (b.dataset.copy === 'style') text = INTRO; else { const [k, i] = b.dataset.copy.split(':'); text = full(G.find(g => g[1] === k)[2][+i]); }
  const ok = () => { b.textContent = '복사됨'; b.classList.add('done'); setTimeout(() => { b.textContent = '복사'; b.classList.remove('done'); }, 1500); };
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (x) { b.textContent = '길게 눌러 복사'; } t.remove(); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (x) { fallback(); }
});
