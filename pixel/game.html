<style>
/* Layout: caravan ledger — header with money/cargo, three tabs (town, caravan, map), full-screen battle overlay.

:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  if (!inTown()) { const near = nearestTown(); el.innerHTML = `<div class="card"><div class="row"><div class="info"><b>지금은 정착지 밖이에요</b><small>시장·공방·여관은 정착지 안에서 쓸 수 있어요 · 가장 가까운 곳: ${ZONES[near.z].n} (${near.d}m)</small></div><button class="btn small primary" data-act="walk" data-x="${TOWNS[near.z].x}" data-y="${TOWNS[near.z].y + 60}" data-l="${ZONES[near.z].n} 정착지">가기</button></div></div>`; return; }
  const used = cargoUsed(), cap = capacity();
  const others = Object.keys(ZONES).filter(o => o !== z);
  const goods = Object.keys(GOODS).filter(g => !GOODS[g].made || S.cargo[g]).map(g => {
    const G = GOODS[g], p = price(z, g), sp = sellPrice(z, g), rel = rawPrice(z, g) / G.base, have = S.cargo[g] || 0;
    const cls = rel < 0.85 ? 'up' : rel > 1.2 ? 'down' : '';
    const best = others.map(o => [o, sellPrice(o, g)]).sort((a, b) => b[1] - a[1])[0];
    const tip = best[1] > p ? `<span class="up">${ZONES[best[0]].n}에 팔면 개당 +${best[1] - p}</span>` : best[1] > sp ? `${ZONES[best[0]].n}에서 ${best[1]}` : '여기가 가장 비싸요';
    return `<div class="row">${ic(g)}<div class="info"><b>${G.n} <span class="${cls}" style="font-weight:400;font-size:11px">${G.made ? '가공품' : rel < 0.85 ? '싸요' : rel > 1.2 ? '비싸요' : ''}</span></b><small>${G.made ? '' : `살 때 ${p} · `}팔 때 ${sp} · 보유 ${have}</small><small>${tip}</small></div>
      ${G.made ? '' : `<button class="btn small" data-act="buy" data-g="${g}" data-n="1" ${S.money < p || used >= cap ? 'disabled' : ''}>1개</button>
      <button class="btn small" data-act="buy" data-g="${g}" data-n="max" ${S.money < p || used >= cap ? 'disabled' : ''}>가득</button>`}
      <button class="btn small primary" data-act="sell" data-g="${g}" ${have ? '' : 'disabled'}>모두 팔기</button></div>`;
  }).join('');
  const quests = (S.quests[z] || []).map((q, i) => {
    const have = q.type === 'deliver' ? Math.min(q.n, S.cargo[q.g] || 0) : q.prog, ok = have >= q.n;
    return `<div class="row"><div class="info"><b>${q.type === 'deliver' ? `${GOODS[q.g].n} ${q.n}개 납품` : `이 구역 사냥터에서 ${q.n}번 승리`}</b><div class="bar"><i style="width:${Math.min(100, have / q.n * 100)}%"></i></div><small>${have}/${q.n} · 보상 ${q.money} 크레딧 · 상단 경험치 ${q.xp}</small></div>
      <button class="btn small ${ok ? 'primary' : ''}" data-act="quest" data-i="${i}" ${ok ? '' : 'disabled'}>${q.type === 'deliver' ? '납품' : '보고'}</button></div>`;
  }).join('');
  const job = S.jobs[z], outs = Object.entries(S.out[z] || {}).filter(([, k]) => k > 0);
  const maxCraft = R => Math.min(20, ...Object.entries(R.in).map(([g, k]) => Math.floor((S.cargo[g] || 0) / k)), Math.floor(S.money / R.fee));
  const shop = Object.entries(RECIPES).filter(([, R]) => R.zone === z).map(([id, R]) => {
    const mx = maxCraft(R), outN = R.out === 'dart' ? '마취 다트' : GOODS[R.out].n;
    return `<div class="row"><div class="info"><b>${R.n}</b><small>${Object.entries(R.in).map(([g, k]) => `${GOODS[g].n} ${k}`).join(' + ')} → ${outN} ${R.qty}개 · 1회 ${Math.round(R.t * (1 - 0.12 * sk('craft')))}초 · 품삯 ${R.fee}</small></div>
      <button class="btn small" data-act="craft" data-r="${id}" data-n="1" ${job || mx < 1 ? 'disabled' : ''}>1회</button><button class="btn small primary" data-act="craft" data-r="${id}" data-n="${mx}" ${job || mx < 2 ? 'disabled' : ''}>${mx > 1 ? mx + '회' : '최대'}</button></div>`;
  }).join('');
  const jobRow = job ? `<div class="row"><div class="info"><b>작업 중: ${RECIPES[job.r].n}</b><div class="bar"><i style="width:${(1 - job.left / job.total) * 100}%;background:var(--amber)"></i></div><small>${job.total - job.left}/${job.total}회 완료 · 다른 구역에 다녀와도 계속 만들어요</small></div></div>` : '';
  const outRow = outs.length ? `<div class="row"><div class="info"><b>완성품</b><small>${outs.map(([g, k]) => `${g === 'dart' ? '마취 다트' : GOODS[g].n} ${k}개`).join(' · ')}</small></div><button class="btn small primary" data-act="collect">찾기</button></div>` : '';
  const recruit = hireAll().map(t => { const D = UNITS[t]; return `<div class="row"><canvas data-u="${t}" width="104" height="80"></canvas><div class="info"><b>${D.n} <span class="tag">${D.role}</span></b><small>${D.ds}</small><small>체력 ${D.hp} · 공격 ${D.atk} · 짐 ${D.carry}칸 · Lv${1}로 합류 · 일당 ${wageOf({ type: t, lv: 1 })}</small></div><button class="btn small primary" data-act="hire" data-t="${t}" ${S.money < hireCost(t, z) ? 'disabled' : ''}>${fmt(hireCost(t, z))}</button></div>`; }).join('');
  const tame = Z.tame.map(t => `${UNITS[t].n}(${UNITS[t].role})`).join(', ') + ` · 희귀종: ${Z.rare.map(t => S.dex[t] ? UNITS[t].n : '???').join(', ')} (깊은 곳에서 가끔 나와요)`;
  const hurt = S.units.filter(u => u.hp < maxHp(u) || u.ko), healCost = Math.round(S.units.reduce((s, u) => s + (maxHp(u) - u.hp), 0) * 0.12) + (hurt.length ? 5 : 0);
  const qReady = (S.quests[z] || []).filter(q => (q.type === 'deliver' ? (S.cargo[q.g] || 0) : q.prog) >= q.n).length;
  const secs = [['hunt', '사냥터'], ['market', '시장'], ['quest', '의뢰', qReady], ['shop', '공방', outs.length ? '!' : 0], ['hire', '고용'], ['bank', '전장'], ['inn', '여관', hurt.length && townSec !== 'inn' ? '!' : 0]];
  const SPOTN = { hunt: '사냥터 안내소', market: '시장', shop: '공방', bank: '은행', inn: '여관', hire: '고용소', quest: '의뢰소', store: '잡화점', trial: '시련의 탑' };
  el.innerHTML = `<div class="tbanner" style="background-image:linear-gradient(rgba(20,15,11,0) 35%, rgba(20,15,11,.88)), url(art/town-${bioOf(z)}.webp)"><small>${Z.n} 정착지</small><b>${SPOTN[townSec] || '정착지'}</b></div>
    ${townSec === 'hunt' ? `<h2>사냥터<small>여기서 길들일 수 있는 공룡: ${tame}</small></h2>
    <div class="card">${HUNTS.map((H, i) => { const done = i < (S.cleared[z] || 0), G = GROUNDS[z][i], dist = Math.round(Math.hypot(G[0] - S.pos.x, G[1] - S.pos.y) / 10);
      return `<div class="row"><span class="num${done ? ' done' : ''}${H.boss ? ' boss' : ''}">${H.boss ? '★' : i + 1}</span><div class="info"><b>${HUNT_NAMES[z][i]} ${done ? '<span class="tag">정복</span>' : ''}${H.boss ? ' <span class="tag" style="color:var(--bad)">우두머리</span>' : ''}</b><small>${H.boss ? `${BOSSES[Z.boss].n} Lv${(Z.bossLv || zl(Z, 6))} · 희귀 이상 장비 확정` : `Lv${zl(Z, H.lv[0])}~${zl(Z, H.lv[1])} · 희귀종 ${Math.round(H.rare * 50)}% · 장비 ${Math.round(H.drop * 100)}%`} · 거리 ${dist}m</small><small style="color:${partyPower() >= groundPower(z, i) ? '#8fbf6a' : 'var(--bad)'}">권장 전투력 ${fmt(groundPower(z, i))} · 내 상단 ${fmt(partyPower())}</small></div>
        <button class="btn small primary" data-act="walk" data-x="${G[0]}" data-y="${G[1] + (H.boss ? 150 : 0)}" data-l="${HUNT_NAMES[z][i]}">가기</button></div>`; }).join('')}</div>` : ''}
    ${townSec === 'market' ? `<h2>시장<small>사면 값이 오르고, 팔면 떨어져요 · 매일 시세가 바뀌어요</small></h2>
    <div class="cargobar"><span>짐칸 ${used}/${cap}</span><div class="bar"><i style="width:${Math.min(100, used / Math.max(1, cap) * 100)}%;background:${used >= cap ? 'var(--bad)' : 'var(--amber)'}"></i></div></div><div class="card">${goods}</div>` : ''}
    ${townSec === 'quest' ? `<h2>의뢰 게시판<small>매일 새 의뢰가 올라와요</small></h2>

    ${townSec === 'shop' ? `<h2>공방<small>재료를 맡기면 시간이 지나 가공품이 돼요 · 장비와 비싼 교역품을 만들어요</small></h2>

    <div class="card">${HEROES.map((h, i) => { const got = S.heroes[h.name], c = heroCost(h); return `<div class="row"><canvas data-u="${h.type}" data-t="1" width="104" height="80"></canvas><div class="info"><b style="color:var(--amber)">${h.name}</b><small>${JOBS[h.type][1]} · Lv${1}로 합류 · ${SK[skillOf(h.type)] ? '스킬 ' + skName(skillOf(h.type), 1) : '짐꾼'}</small></div><button class="btn small ${got ? '' : 'primary'}" data-act="famed" data-i="${i}" ${got || S.money < c ? 'disabled' : ''}>${got ? '고용함' : fmt(c)}</button></div>`; }).join('')}</div>

    <div class="card">${S.eggs.map((e, i) => `<div class="row"><div class="info"><b>${ZONES[e.z].n}의 알</b><div class="bar"><i style="width:${(1 - Math.max(0, e.t) / 150) * 100}%;background:var(--amber)"></i></div><small>${e.t > 0 ? `부화까지 ${Math.ceil(e.t)}초 · 다른 곳에 다녀와도 계속 품어요` : '껍질에 금이 갔어요'}</small></div><button class="btn small primary" data-act="hatch" data-i="${i}" ${e.t > 0 ? 'disabled' : ''}>깨우기</button></div>`).join('')}
      ${Object.entries(S.eggBag).filter(([, k]) => k > 0).map(([ez, k]) => `<div class="row"><div class="info"><b>${ZONES[ez].n}의 알 ${k}개</b><small>가지고 있어요 · 한 번에 3개까지 품을 수 있어요</small></div><button class="btn small" data-act="incubate" data-z="${ez}" ${S.eggs.length >= 3 ? 'disabled' : ''}>맡기기</button></div>`).join('')}
      ${S.eggs.length || Object.values(S.eggBag).some(k => k > 0) ? '' : '<div class="row"><div class="info"><small>알이 없어요 · 우두머리(60%)와 희귀종 무리(15%), 깊은 사냥터에서 가끔 나와요</small></div></div>'}</div>
    <h2>고용소<small>어느 정착지에서나 같은 값에 고용해요 · 모두 레벨 1로 합류해서 직접 키워야 해요</small></h2>
    <div class="card">${recruit}</div>` : ''}
    ${townSec === 'bank' ? (() => { const inv = S.invest[z] || 0, head = isHead(z), st = Object.entries(S.store[z] || {}).filter(([, k]) => k > 0), cg = Object.entries(S.cargo);
      const amt = (act, max) => [100, 1000].filter(n => n <= max).map(n => `<button class="btn small" data-act="${act}" data-n="${n}">${n}</button>`).join('') + `<button class="btn small primary" data-act="${act}" data-n="${max}" ${max > 0 ? '' : 'disabled'}>전부</button>`;
      return `<h2>전장<small>돈을 맡기면 매일 1% 이자가 붙고, 상단이 쓰러져도 잃지 않아요</small></h2>
      <div class="card"><div class="row"><div class="info"><b>예금 ${fmt(S.bank)} 크레딧</b><small>맡기기 · 가진 돈 ${fmt(S.money)}</small></div>${amt('dep', S.money)}</div>
      <div class="row"><div class="info"><b>찾기</b><small>어느 정착지 전장에서든 찾을 수 있어요</small></div>${amt('wd', S.bank)}</div></div>
      <h2>마을 투자<small>투자금의 3%를 매일 배당으로 받아요 · 가장 많이 투자하면 이 마을의 대방이 돼요</small></h2>
      <div class="card"><div class="row"><div class="info"><b>${head ? '당신이 이 마을의 대방이에요' : `현재 대방: ${RIVALS[z][0]}`}</b><small>내 투자 ${fmt(inv)} · ${head ? `2위 ${RIVALS[z][0]} ${fmt(S.rival[z])}` : `대방까지 ${fmt(S.rival[z] - inv + 1)} 더`} · 대방 혜택: 이 마을에서 5% 싸게 사고 5% 비싸게 팔아요</small></div>${amt('inv', S.money)}</div></div>
      <h2>여각 (창고)<small>짐을 이 정착지에 맡겨 둬요 · 다른 정착지에서는 찾을 수 없어요</small></h2>
      <div class="card">${cg.length ? cg.map(([g, k]) => `<div class="row"><div class="info"><b>${GOODS[g].n} ${k}개</b><small>짐칸에 있어요</small></div><button class="btn small" data-act="stIn" data-g="${g}">맡기기</button></div>`).join('') : ''}${st.map(([g, k]) => `<div class="row"><div class="info"><b>${GOODS[g].n} ${k}개</b><small>창고에 있어요</small></div><button class="btn small primary" data-act="stOut" data-g="${g}">찾기</button></div>`).join('')}${cg.length || st.length ? '' : '<div class="row"><div class="info"><small>맡긴 짐이 없어요</small></div></div>'}</div>`; })() : ''}
    ${townSec === 'trial' ? `<h2>시련의 탑<small>층마다 그 층 레벨의 공룡이 나와요 · 10층마다 우두머리 · 한 번 넘은 층은 다시 오르지 않아요</small></h2>
    <div class="card"><div class="row"><div class="info"><b>${S.tower >= 200 ? '꼭대기에 올랐어요 (200층)' : `다음: ${S.tower + 1}층`}</b><div class="bar"><i style="width:${S.tower / 2}%;background:var(--amber)"></i></div><small>최고 ${S.tower}/200층${S.tower < 200 ? ` · 적 Lv${S.tower + 1} · ${Math.min(10, 3 + Math.floor((S.tower + 1) / 12))}마리${(S.tower + 1) % 10 === 0 ? ` · <b style="color:var(--bad)">우두머리 ${BOSSES[trialBoss(S.tower + 1)].n}</b>` : ''} · 상금 ${fmt(60 * (S.tower + 1))}${(S.tower + 1) % 10 === 0 ? ' + 증표·알·회복약' : ''}` : ''}</small><small>내 대원 최고 Lv${Math.max(...S.units.map(u => u.lv))} · 정착지 바로 옆에서 싸워요</small></div><button class="btn small primary" data-act="trial" ${S.tower >= 200 ? 'disabled' : ''}>도전</button></div></div>` : ''}

    </div>` : ''}
    ${townSec === 'inn' ? `<h2>여관</h2>

    </div>` : ''}`;
  el.querySelectorAll('canvas[data-u]').forEach(cv => portrait(cv, cv.dataset.u));
  el.querySelectorAll('canvas[data-shot]').forEach(cv => { try { const T = TOWNS[cv.dataset.shot], g = cv.getContext('2d'); g.imageSmoothingEnabled = false; if (!W) initWorld(); drawScene(g, T.x - 180, T.y - 120, 360, 160, W.folk.filter(f => f.z === cv.dataset.shot && !f.len).map(f => ({ x: f.x, y: f.y, a: f.a, type: f.type, anim: 'idle', fi: 0 }))); } catch (e) { /* header stays blank */ } });
}
function renderParty() {
  const el = $('v-party'), P = party();
  const row = u => { const D = UNITS[u.type], mh = maxHp(u);
