function sndTick() {

    if (battle) {
      if (st % 4 === 0 || st % 16 === 10) noiseHit(0.2, { freq: 100, type: 'lowpass', vol: 0.55, at, dest: SND.music });
      if (st % 8 === 4) noiseHit(0.14, { freq: 1800, q: 0.7, vol: 0.16, at, dest: SND.music });
      tone(mtof(root + [0, 0, 12, 0, 3, 0, 7, 10][st % 8]), beat * 0.9, { type: 'square', vol: 0.016, at, dest: SND.music });
