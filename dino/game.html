<title>공룡 상단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: caravan ledger — header with money/cargo, three tabs (town, caravan, map), full-screen battle overlay.
   Single post-apocalyptic look: dust, rust and ash. */
:root {
  --bg: #1c1711; --panel: #26201a; --panel-2: #312921; --line: #463a2d;
  --text: #ece3d4; --muted: #a89a86; --rust: #d0743a; --amber: #e3a843; --good: #8fbf6a; --bad: #d4573c; --steel: #8fa3b0;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 13px; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button[disabled] { opacity: .4; pointer-events: none; }
#app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
header { padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: linear-gradient(#2a221a, var(--bg)); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0; letter-spacing: .02em; color: var(--rust); }
.brand small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: flex; gap: 5px; }
.rc { display: flex; flex-direction: column; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; min-width: 52px; }
.rc em { font-style: normal; font-size: 9px; color: var(--muted); }
.rc b { font-size: 13px; font-variant-numeric: tabular-nums; }
.rc.money b { color: var(--amber); }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 0; letter-spacing: .02em; }
h2 small { font-family: var(--f-body); font-size: 11px; color: var(--muted); margin-left: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px; display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.row + .row { border-top: 1px dashed var(--line); padding-top: 9px; }
.row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .info b { font-weight: 600; font-size: 13px; }
.row .info small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.row canvas { flex: none; width: 52px; height: 40px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-weight: 600; font-size: 12px; flex: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--rust); color: #1c120a; border-color: #8f4a1e; }
.btn.big { width: 100%; padding: 13px; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.btn.small { padding: 6px 8px; font-size: 11px; }
.up { color: var(--good); } .down { color: var(--bad); }
.zonehead { position: relative; border-radius: 12px; overflow: hidden; min-height: 116px; display: flex; align-items: flex-end; border: 1px solid var(--line); }
.zonehead canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.zonehead .zt { position: relative; padding: 12px; background: linear-gradient(transparent, rgba(20,15,10,.92)); width: 100%; }
.zonehead .zt b { font-family: var(--f-display); font-weight: 400; font-size: 22px; display: block; }
.zonehead .zt small { color: #d8cdb9; font-size: 11px; }
.danger { color: var(--bad); letter-spacing: 1px; }
.hunts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.hunts .btn { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 9px 4px; }
.hunts .btn small { font-weight: 400; font-size: 10px; color: var(--muted); }
.hunts .btn.boss { border-color: var(--bad); }
.bar { height: 5px; background: #3a2e22; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.tag.on { background: var(--rust); color: #1c120a; border-color: var(--rust); }
#mapcv { width: 100%; aspect-ratio: 360 / 300; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
.travel { display: flex; flex-direction: column; gap: 6px; }
.travel .bar { height: 8px; } .travel .bar i { background: var(--amber); }
#tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 5px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); gap: 4px; }
#tabs button { flex: 1; border-radius: 8px; padding: 8px 2px; font-family: var(--f-display); font-size: 15px; color: var(--muted); }
#tabs button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--rust); }
#battle { position: absolute; inset: 0; z-index: 20; background: #120e0a; display: flex; flex-direction: column; }
.bhead { display: flex; align-items: center; gap: 8px; padding: 7px max(12px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px)); }
.bhead b { font-family: var(--f-display); font-weight: 400; font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bhead small { color: var(--muted); font-size: 11px; }
.bfield { flex: 1; min-height: 0; position: relative; }
#bcv { width: 100%; height: 100%; display: block; touch-action: none; }
#bTip { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 11px; color: #d8cdb9; background: rgba(18,14,10,.7); padding: 3px 9px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
#bSel { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(18,14,10,.86); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
#bSel .bar { flex: 1; } #bSel .bar i { background: var(--bad); }
.bfoot { display: flex; gap: 6px; padding: 7px max(12px, env(safe-area-inset-right, 0px)) 9px max(12px, env(safe-area-inset-left, 0px)); }
.bfoot .btn { flex: 1; padding: 11px 6px; font-size: 13px; }
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(8,6,4,.72); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; animation: pop .22s ease-out; }
.mcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; text-align: center; }
.mcard .sub { text-align: center; color: var(--muted); font-size: 12px; margin-top: -5px; line-height: 1.5; }
.mbtns { display: flex; gap: 8px; } .mbtns .btn { flex: 1; padding: 11px; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
#toast { position: absolute; left: 50%; top: 56px; transform: translate(-50%, -6px); background: rgba(28,23,17,.95); border: 1px solid var(--line); padding: 7px 14px; border-radius: 16px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; max-width: calc(100% - 24px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { border-color: var(--bad); } #toast.good { border-color: var(--amber); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header>
    <div class="brand"><h1>공룡 상단</h1><small id="sub"></small></div>
    <div class="res">
      <span class="rc money"><em>크레딧</em><b id="rMoney">0</b></span>
      <span class="rc"><em>짐칸</em><b id="rCargo">0/0</b></span>
      <span class="rc"><em>날짜</em><b id="rDay">1</b></span>
    </div>
  </header>
  <main>
    <section class="view" id="v-town"></section>
    <section class="view" id="v-party" hidden></section>
    <section class="view" id="v-map" hidden></section>
  </main>
  <nav id="tabs">
    <button data-v="town" class="on">정착지</button>
    <button data-v="party">상단</button>
    <button data-v="map">지도</button>
  </nav>
  <div id="battle" hidden>
    <div class="bhead"><b id="bTitle"></b><small id="bInfo"></small></div>
    <div class="bfield"><canvas id="bcv"></canvas><div id="bTip">적을 눌러 집중 공격 · 체력 30% 이하면 포획</div><div id="bSel" hidden><span id="bSelName"></span><span class="bar"><i id="bSelHp"></i></span></div></div>
    <div class="bfoot"><button class="btn" id="bRetreat">후퇴</button><button class="btn primary" id="bCapture">포획</button><button class="btn" id="bSpeed">×1</button></div>
  </div>
  <div id="toast"></div>
  <div id="modal" hidden><div class="mcard" id="mcard"></div></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const fmt = n => Math.floor(n).toLocaleString('ko-KR');

/* ================================================================
   WORLD DATA — three zones instead of nations; no elements
   ================================================================ */
const GOODS = {
  grain: { n: '곡물', base: 9 }, meat: { n: '고기', base: 14 }, hide: { n: '가죽', base: 20 }, bone: { n: '뼈', base: 12 },
  water: { n: '깨끗한 물', base: 16 }, ammo: { n: '탄약', base: 28 }, parts: { n: '기계 부품', base: 42 },
  herb: { n: '약초', base: 24 }, venom: { n: '독샘', base: 50 },
};
const ZONES = {
  plain: { n: '잿빛 평원', lv: 1, danger: 1, ground: 'plain', mx: 0.24, my: 0.72,
    ds: '재가 날리는 마른 초원. 초식 공룡 떼가 지나가고, 살아남은 농부들이 곡물을 키워요.',
    recruit: ['hunter', 'spear'], tame: ['trike', 'pachy'], wild: ['pachy', 'pachy', 'trike'], boss: 'trikeKing',
    loot: { meat: 3, hide: 2, bone: 1 }, price: { grain: .55, hide: .8, meat: .85, bone: .9, water: 1.05, ammo: 1.45, parts: 1.35, herb: 1.35, venom: 1.4 } },
  city: { n: '무너진 도시', lv: 5, danger: 2, ground: 'city', mx: 0.74, my: 0.42,
    ds: '공룡에게 짓밟힌 옛 도시. 폐허에서 부품과 탄약을 캐지만 먹을 것과 물이 귀해요. 랩터 무리가 골목을 지배해요.',
    recruit: ['sniper', 'mechanic'], tame: ['raptor', 'compy'], wild: ['compy', 'compy', 'raptor', 'raptor'], boss: 'oneEye',
    loot: { parts: 2, ammo: 1, meat: 1, hide: 1 }, price: { parts: .55, ammo: .65, meat: 1.5, grain: 1.45, water: 1.6, herb: 1.2, hide: 1.1, bone: 1.15, venom: 1.25 } },
  swamp: { n: '썩은 늪지', lv: 9, danger: 3, ground: 'swamp', mx: 0.3, my: 0.24,
    ds: '독이 고인 늪. 약초와 독샘이 나지만 거대 악어와 산성 침을 뱉는 공룡이 숨어 있어요.',
    recruit: ['medic', 'venomer'], tame: ['dilo', 'sarco'], wild: ['dilo', 'dilo', 'sarco', 'compy'], boss: 'swampKing',
    loot: { herb: 2, venom: 1, meat: 2, hide: 1 }, price: { herb: .55, venom: .6, water: .85, parts: 1.6, ammo: 1.35, grain: 1.25, meat: 1.1, hide: 1.2, bone: 1.1 } },
};
const ROUTES = { 'plain|city': { t: 26, danger: 1.3 }, 'city|swamp': { t: 32, danger: 2.3 }, 'plain|swamp': { t: 38, danger: 2.7 } };
const routeOf = (a, b) => ROUTES[a + '|' + b] || ROUTES[b + '|' + a];
// Units: people for hire and dinosaurs to tame. carry = cargo slots the unit adds.
const UNITS = {
  leader:  { n: '상단 대장', cls: 'human', role: '원거리', hp: 130, atk: 14, def: 6, spd: 40, range: 120, as: 1.0, carry: 10, gun: true, ds: '상단을 이끄는 당신. 소총을 써요.' },
  hunter:  { n: '사냥꾼', cls: 'human', role: '원거리', hp: 80, atk: 11, def: 3, spd: 42, range: 125, as: 1.1, carry: 3, cost: 120, bow: true, ds: '활로 멀리서 꾸준히 공격해요.' },
  spear:   { n: '창잡이', cls: 'human', role: '탱커', hp: 160, atk: 9, def: 11, spd: 36, range: 20, as: 0.9, carry: 3, cost: 150, taunt: true, ds: '앞줄에서 적을 붙잡아 둬요.' },
  sniper:  { n: '저격수', cls: 'human', role: '원거리', hp: 70, atk: 34, def: 2, spd: 34, range: 210, as: 0.42, carry: 2, cost: 340, gun: true, ds: '아주 멀리서 강한 한 발을 쏴요.' },
  mechanic:{ n: '정비공', cls: 'human', role: '지원', hp: 100, atk: 8, def: 6, spd: 36, range: 100, as: 1, carry: 4, cost: 300, turret: true, ds: '전투가 시작되면 자동 포탑을 설치해요.' },
  medic:   { n: '의무병', cls: 'human', role: '회복', hp: 90, atk: 5, def: 4, spd: 38, range: 110, as: 1, carry: 3, cost: 320, heal: 14, ds: '가장 다친 동료를 치료해요.' },
  venomer: { n: '독침술사', cls: 'human', role: '약화', hp: 85, atk: 7, def: 3, spd: 40, range: 115, as: 0.9, carry: 3, cost: 360, shred: 4, ds: '독침으로 적의 장갑을 녹여 모두의 피해를 늘려요.' },
  trike:   { n: '트리케라톱스', cls: 'dino', role: '탱커', hp: 440, atk: 22, def: 16, spd: 27, range: 24, as: 0.7, carry: 40, size: 30, taunt: true, ds: '짐을 40칸 지는 단단한 방패. 상단의 기둥이에요.' },
  pachy:   { n: '파키케팔로사우루스', cls: 'dino', role: '기절', hp: 230, atk: 18, def: 9, spd: 46, range: 20, as: 0.8, carry: 8, size: 21, stun: 1.2, ds: '박치기로 적을 기절시켜요. 큰 적에게는 안 통해요.' },
  raptor:  { n: '벨로키랍토르', cls: 'dino', role: '돌격', hp: 140, atk: 16, def: 4, spd: 72, range: 15, as: 1.6, carry: 4, size: 17, pack: true, ds: '빠른 사냥꾼. 같은 랩터가 가까이 있으면 더 강해져요.' },
  compy:   { n: '콤프소그나투스', cls: 'dino', role: '떼', hp: 50, atk: 7, def: 1, spd: 66, range: 11, as: 1.9, carry: 1, size: 10, ds: '작지만 빠르고 많아요.' },
  dilo:    { n: '딜로포사우루스', cls: 'dino', role: '약화', hp: 190, atk: 12, def: 5, spd: 46, range: 75, as: 0.9, carry: 6, size: 21, shred: 6, acid: true, ds: '산성 침으로 적의 장갑을 녹여요.' },
  sarco:   { n: '사르코수쿠스', cls: 'dino', role: '파괴', hp: 400, atk: 36, def: 14, spd: 24, range: 22, as: 0.6, carry: 15, size: 34, ds: '버스만 한 거대 악어. 한 번 물면 놓지 않아요.' },
};
const BOSSES = {
  trikeKing: { base: 'trike', n: '늙은 우두머리 트리케라톱스', hp: 4.5, atk: 1.6, size: 1.35 },
  oneEye:    { base: 'raptor', n: '외눈 랩터', hp: 5, atk: 2.1, size: 1.35 },
  swampKing: { base: 'sarco', n: '늪의 왕', hp: 4, atk: 1.7, size: 1.45 },
};
const lvMul = lv => 1 + 0.12 * (lv - 1);
const xpNeed = lv => Math.round(22 * Math.pow(lv, 1.45));
const STUN_HP_LIMIT = 700;   // like monster grades: big creatures shrug off stuns
const DAY_LEN = 90;

/* ================================================================
   STATE
   ================================================================ */
const SAVE = 'dino-caravan-v1';
let S;
function freshState() {
  const s = { money: 300, t: 0, day: 1, zone: 'plain', travel: null, cargo: {}, darts: 3, idSeq: 1, units: [], drift: {}, press: {}, stats: { battles: 0, captures: 0, trades: 0, earned: 0 }, snd: 2 };
  for (const z of Object.keys(ZONES)) { s.drift[z] = {}; s.press[z] = {}; for (const g of Object.keys(GOODS)) { s.drift[z][g] = 1; s.press[z][g] = 1; } }
  S = s;
  addUnit('leader', 1, true); addUnit('hunter', 1, true); addUnit('spear', 1, true);
  const t = addUnit('trike', 2, true); t.name = '돌덩이';
  return s;
}
function addUnit(type, lv, inParty) {
  const u = { id: S.idSeq++, type, lv, xp: 0, hp: 0, ko: false, inParty: !!inParty };
  u.hp = maxHp(u); S.units.push(u); return u;
}
const maxHp = u => Math.round(UNITS[u.type].hp * lvMul(u.lv));
const party = () => S.units.filter(u => u.inParty);
const capacity = () => party().reduce((s, u) => s + UNITS[u.type].carry, 0);
const cargoUsed = () => Object.values(S.cargo).reduce((a, b) => a + b, 0);
function load() { try { const r = localStorage.getItem(SAVE); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

/* market: zone price × daily drift × buying/selling pressure */
const price = (z, g) => Math.max(1, Math.round(GOODS[g].base * ZONES[z].price[g] * S.drift[z][g] * S.press[z][g]));
const sellPrice = (z, g) => Math.max(1, Math.round(price(z, g) * 0.9));
function newDay() {
  S.day++;
  for (const z of Object.keys(ZONES)) for (const g of Object.keys(GOODS)) S.drift[z][g] = clamp(S.drift[z][g] * rand(0.88, 1.14) + (1 - S.drift[z][g]) * 0.25, 0.6, 1.6);
  // a market event now and then shakes one price hard
  if (Math.random() < 0.5) {
    const z = pick(Object.keys(ZONES)), g = pick(Object.keys(GOODS)), up = Math.random() < 0.5;
    S.drift[z][g] = up ? rand(1.5, 1.9) : rand(0.45, 0.6);
    const why = up ? pick(['랩터 떼가 창고를 습격해', '가뭄이 들어', '수송대가 끊겨']) : pick(['대형 상단이 물건을 풀어', '풍년이 들어', '버려진 창고가 발견되어']);
    toast(`[${S.day}일차 소식] ${ZONES[z].n}: ${why} ${GOODS[g].n} 값이 ${up ? '치솟았어요' : '폭락했어요'}`, up ? 'good' : '');
  }
}
function tick(dt) {
  S.t += dt;
  if (S.t >= S.day * DAY_LEN) newDay();
  for (const z of Object.keys(ZONES)) for (const g of Object.keys(GOODS)) S.press[z][g] += (1 - S.press[z][g]) * Math.min(1, dt * 0.02);
  if (S.travel && !B) travelStep(dt);
}

/* ================================================================
   TRAVEL
   ================================================================ */
function startTravel(to) {
  if (S.travel || to === S.zone) return;

  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, z = S.zone;
  if (act === 'buy') { const g = b.dataset.g; let n = +b.dataset.n, spent = 0; while (n-- > 0 && S.money >= price(z, g) && cargoUsed() < capacity()) { const p = price(z, g); S.money -= p; spent += p; S.cargo[g] = (S.cargo[g] || 0) + 1; S.press[z][g] += 0.025; } if (spent) { sfx('coin'); S.stats.trades++; } }
  else if (act === 'sell') { const g = b.dataset.g; let got = 0; while (S.cargo[g] > 0) { const p = sellPrice(z, g); S.money += p; got += p; S.cargo[g]--; S.press[z][g] = Math.max(0.4, S.press[z][g] - 0.022); } delete S.cargo[g]; S.stats.earned += got; sfx('coin'); toast(`${GOODS[g].n}을 팔아 ${got} 크레딧`, 'good'); }
  else if (act === 'hire') { const t = b.dataset.t, D = UNITS[t]; if (S.money < D.cost) return; S.money -= D.cost; const u = addUnit(t, Math.max(1, ZONES[z].lv - 1), party().length < 12); sfx('coin'); toast(`${D.n}을 고용했어요${u.inParty ? '' : ' (상단이 가득 차 대기)'}`, 'good'); }
  else if (act === 'heal') { const cost = +b.textContent; if (S.money < cost) return; S.money -= cost; for (const u of S.units) { u.hp = maxHp(u); u.ko = false; } toast('모두 푹 쉬었어요', 'good'); sfx('arrive'); }
  else if (act === 'dart') { const n = +b.dataset.n, cost = n === 5 ? 165 : 35; if (S.money < cost) return; S.money -= cost; S.darts += n; sfx('coin'); }
  else if (act === 'hunt') {
    const tier = +b.dataset.tier;
    if (!party().some(u => !u.ko && u.type !== 'leader') && party().find(u => u.type === 'leader').ko) { toast('싸울 수 있는 대원이 없어요. 여관에서 쉬세요', 'warn'); return; }
    const foes = huntFoes(z, tier); startBattle({ kind: 'hunt', zone: z, tier, foes, boss: tier === 3 ? ZONES[z].boss : null }); if (tier === 3) sfx('roar');
  }
  else if (act === 'toggle') { const u = S.units.find(x => x.id === +b.dataset.id); if (!u) return; if (!u.inParty && party().length >= 12) { toast('상단은 대장 포함 12명까지예요'); return; } u.inParty = !u.inParty; if (cargoUsed() > capacity()) toast('짐칸이 모자라요. 출발 전에 짐을 줄이세요', 'warn'); }
  else if (act === 'go') startTravel(b.dataset.z);
  else if (act === 'closeBattle') { closeBattle(); return; }
  else if (act === 'close') closeModal();
  else if (act === 'snd') { sndInit(); S.snd = (S.snd + 2) % 3; applySnd(); }
  save(); renderAll();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sfx('tap'); setView(b.dataset.v); } });
document.addEventListener('pointerdown', sndInit);
window.addEventListener('resize', () => { if (B) resizeBattle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ================================================================
   LOOP
   ================================================================ */
let last = performance.now(), acc = 0, uiAcc = 0, saveAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  tick(dt);
  if (B && !B.over) { acc += dt * bSpeed; let k = 0; while (acc >= 1 / 30 && k < 8) { bStep(1 / 30); acc -= 1 / 30; k++; } if (k >= 8) acc = 0; }
  if (B) renderBattle();
  uiAcc += dt;
  if (uiAcc > 0.5) { uiAcc = 0; renderHeader(); if (view === 'map' && S.travel) { const bar = $('tBar'); if (bar) bar.style.width = (S.travel.p * 100) + '%'; drawMap(); } }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
}
S = load() || freshState();
if (!S.units || !S.units.length) freshState();
setView('town');
if (S.stats.battles === 0) setTimeout(() => toast('잿빛 평원에서 시작해요 · 곡물을 싸게 사서 무너진 도시에 팔아 보세요'), 600);
window.__dino = { get S() { return S; }, get B() { return B; } };
requestAnimationFrame(frame);
})();
</script>
