<!doctype html>
<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1711">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>공룡 상단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: caravan ledger — header with money/cargo, three tabs (town, caravan, map), full-screen battle overlay.
   Single post-apocalyptic look: dust, rust and ash. */
:root {
  --bg: #1c1711; --panel: #26201a; --panel-2: #312921; --line: #463a2d;
  --text: #ece3d4; --muted: #a89a86; --rust: #d0743a; --amber: #e3a843; --good: #8fbf6a; --bad: #d4573c; --steel: #8fa3b0;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 13px; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button[disabled] { opacity: .4; pointer-events: none; }
#app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
header { padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: linear-gradient(#2a221a, var(--bg)); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0; letter-spacing: .02em; color: var(--rust); }
.brand small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: flex; gap: 5px; }
.rc { display: flex; flex-direction: column; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; min-width: 52px; }
.rc em { font-style: normal; font-size: 9px; color: var(--muted); }
.rc b { font-size: 13px; font-variant-numeric: tabular-nums; }
.rc.money b { color: var(--amber); }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 0; letter-spacing: .02em; }
h2 small { font-family: var(--f-body); font-size: 11px; color: var(--muted); margin-left: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px; display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.row + .row { border-top: 1px dashed var(--line); padding-top: 9px; }
.row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .info b { font-weight: 600; font-size: 13px; }
.row .info small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.row canvas { flex: none; width: 52px; height: 40px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-weight: 600; font-size: 12px; flex: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--rust); color: #1c120a; border-color: #8f4a1e; }
.btn.big { width: 100%; padding: 13px; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.btn.small { padding: 6px 8px; font-size: 11px; }
.up { color: var(--good); } .down { color: var(--bad); }
.zonehead { position: relative; border-radius: 12px; overflow: hidden; min-height: 116px; display: flex; align-items: flex-end; border: 1px solid var(--line); }
.zonehead canvas, .zonehead img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.zonehead { min-height: 170px; }
.zonehead .zt { position: relative; padding: 12px; background: linear-gradient(transparent, rgba(20,15,10,.92)); width: 100%; }
.zonehead .zt b { font-family: var(--f-display); font-weight: 400; font-size: 22px; display: block; }
.zonehead .zt small { color: #d8cdb9; font-size: 11px; }
.danger { color: var(--bad); letter-spacing: 1px; }
.hunts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.hunts .btn { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 9px 4px; }
.hunts .btn small { font-weight: 400; font-size: 10px; color: var(--muted); }
.hunts .btn.boss { border-color: var(--bad); }
.bar { height: 5px; background: #3a2e22; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.tag.on { background: var(--rust); color: #1c120a; border-color: var(--rust); }
#mapHost { width: 100%; aspect-ratio: 1 / 1.08; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; background: #2a231b; }
#map3d { width: 100%; height: 100%; display: block; }
#mapcv { width: 100%; aspect-ratio: 360 / 300; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
.travel { display: flex; flex-direction: column; gap: 6px; }
.travel .bar { height: 8px; } .travel .bar i { background: var(--amber); }
#tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 5px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); gap: 4px; }
#tabs button { flex: 1; border-radius: 8px; padding: 8px 2px; font-family: var(--f-display); font-size: 15px; color: var(--muted); }
#tabs button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--rust); }
#battle { position: absolute; inset: 0; z-index: 20; background: #120e0a; display: flex; flex-direction: column; }
.bhead { display: flex; align-items: center; gap: 8px; padding: 7px max(12px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px)); }
.bhead b { font-family: var(--f-display); font-weight: 400; font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bhead small { color: var(--muted); font-size: 11px; }
.bfield { flex: 1; min-height: 0; position: relative; }
#bcv, #b3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.dexg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.dexc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 3px 6px; text-align: center; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.dexc canvas { width: 100%; height: 44px; }
.dexc b { font-size: 10px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.dexc small { font-size: 9px; color: var(--muted); }
.dexc.unk canvas { filter: brightness(0) opacity(.45); }
.dexc.own { border-color: var(--amber); }
#loading { display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; min-height: 60%; color: var(--muted); }
#bTip { animation: tipfade 6s forwards; position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 11px; color: #d8cdb9; background: rgba(18,14,10,.7); padding: 3px 9px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
#bSel { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(18,14,10,.86); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
#bSel .bar { flex: 1; } #bSel .bar i { background: var(--bad); }
.bfoot { display: flex; gap: 6px; padding: 7px max(12px, env(safe-area-inset-right, 0px)) 9px max(12px, env(safe-area-inset-left, 0px)); }
.bfoot .btn { flex: 1; padding: 11px 4px; font-size: 13px; }
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(8,6,4,.72); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; animation: pop .22s ease-out; }
.mcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; text-align: center; }
.mcard .sub { text-align: center; color: var(--muted); font-size: 12px; margin-top: -5px; line-height: 1.5; }
.mbtns { display: flex; gap: 8px; } .mbtns .btn { flex: 1; padding: 11px; }
@keyframes tipfade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
#toast { position: absolute; left: 50%; top: 56px; transform: translate(-50%, -6px); background: rgba(28,23,17,.95); border: 1px solid var(--line); padding: 7px 14px; border-radius: 16px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; max-width: calc(100% - 24px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { border-color: var(--bad); } #toast.good { border-color: var(--amber); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header>
    <div class="brand"><h1>공룡 상단</h1><small id="sub"></small></div>
    <div class="res">
      <span class="rc money"><em>크레딧</em><b id="rMoney">0</b></span>
      <span class="rc"><em>짐칸</em><b id="rCargo">0/0</b></span>
      <span class="rc"><em>날짜</em><b id="rDay">1</b></span>
    </div>
  </header>
  <main>
    <section class="view" id="v-town"></section>
    <section class="view" id="v-party" hidden></section>
    <section class="view" id="v-map" hidden></section>
  </main>
  <nav id="tabs">
    <button data-v="town" class="on">정착지</button>
    <button data-v="party">상단</button>
    <button data-v="map">지도</button>
  </nav>
  <div id="battle" hidden>
    <div class="bhead"><b id="bTitle"></b><small id="bInfo"></small></div>
    <div class="bfield"><canvas id="b3d"></canvas><canvas id="bcv"></canvas><div id="bTip">적을 눌러 집중 공격 · 체력 30% 이하면 포획</div><div id="bSel" hidden><span id="bSelName"></span><span class="bar"><i id="bSelHp"></i></span></div></div>
    <div class="bfoot"><button class="btn" id="bRetreat">후퇴</button><button class="btn primary" id="bCapture">포획</button><button class="btn" id="bZoom">크게</button><button class="btn" id="bSpeed">×1</button></div>
  </div>
  <div id="toast"></div>
  <div id="modal" hidden><div class="mcard" id="mcard"></div></div>
</div>

<script>

function addUnit(type, lv, inParty) {

/* market: zone price × daily drift × buying/selling pressure */
const zp = (z, g) => ZONES[z].price[g] ?? (GOODS[g].zp ? GOODS[g].zp[z] : 1);
const rawPrice = (z, g) => GOODS[g].base * zp(z, g) * S.drift[z][g] * S.press[z][g];

  for (const z of Object.keys(ZONES)) {
    const keep = (S.quests[z] || []).filter(q => q.prog > 0 && !q.done), list = [...keep];
    const wanted = Object.keys(GOODS).filter(g => zp(z, g) >= 1.2);
    while (list.length < 3) {
      if (list.filter(q => q.type === 'hunt').length < 1) { const n = 2 + (Math.random() * 3 | 0); list.push({ id: Math.random(), type: 'hunt', n, prog: 0, money: 40 * n * ZONES[z].danger, xp: 25 * n }); }
      else { const g = pick(wanted), n = GOODS[g].made ? 2 + (Math.random() * 3 | 0) : 6 + (Math.random() * 10 | 0); if (list.some(q => q.g === g)) continue; list.push({ id: Math.random(), type: 'deliver', g, n, prog: 0, money: Math.round(GOODS[g].base * zp(z, g) * n * 1.7), xp: Math.round(GOODS[g].base * n / 8) + 15 }); }

}
function newDay() {

  if (Math.random() < 0.5) {
    const z = pick(Object.keys(ZONES)), g = pick(Object.keys(GOODS)), up = Math.random() < 0.5;
    S.drift[z][g] = up ? rand(1.5, 1.9) : rand(0.45, 0.6);
    const why = up ? pick(['랩터 떼가 창고를 습격해', '가뭄이 들어', '수송대가 끊겨']) : pick(['대형 상단이 물건을 풀어', '풍년이 들어', '버려진 창고가 발견되어']);
    toast(`[${S.day}일차 소식] ${ZONES[z].n}: ${why} ${GOODS[g].n} 값이 ${up ? '치솟았어요' : '폭락했어요'}`, up ? 'good' : '');
  }
}
function tick(dt) {
  S.t += dt;

  for (const z of Object.keys(ZONES)) for (const g of Object.keys(GOODS)) S.press[z][g] += (1 - S.press[z][g]) * Math.min(1, dt * 0.02);
  if (S.travel && !B) travelStep(dt);
  for (const [z, j] of Object.entries(S.jobs)) {   // workshops keep working wherever the caravan is
    if (!j) continue; const R = RECIPES[j.r]; j.t += dt;

    if (j.left <= 0) { S.jobs[z] = null; toast(`${ZONES[z].n} 공방: ${R.n} 완료 · 찾으러 가세요`, 'good'); if (view === 'town') renderTown(); }
  }
  if (!B) for (const u of S.units) {
    const mh = maxHp(u); if (u.hp >= mh) continue;
    u.hp = Math.min(mh, u.hp + mh * (S.travel ? 0.003 : 0.01) * dt);
    if (u.ko && u.hp >= mh * 0.3) { u.ko = false; if (view === 'town') toast(`${unitName(u)}가 기운을 차렸어요`); }
  }
}

/* ================================================================
   TRAVEL
   ================================================================ */
function startTravel(to) {
  if (S.travel || to === S.zone) return;
  if (party().some(u => u.ko && u.type === 'leader')) { toast('대장이 쓰러져 있어요. 여관에서 회복한 뒤 떠나세요', 'warn'); return; }
  if (cargoUsed() > capacity()) { toast('짐이 짐칸보다 많아요. 짐을 팔거나 짐 공룡을 데려가세요', 'warn'); return; }
  const R = routeOf(S.zone, to), events = [];
  const ambushes = Math.random() < Math.min(0.9, 0.35 * R.danger) ? 1 + (Math.random() < R.danger * 0.15 ? 1 : 0) : 0;
  for (let i = 0; i < ambushes; i++) events.push({ at: rand(0.2, 0.85), kind: 'ambush' });
  if (Math.random() < 0.45) events.push({ at: rand(0.15, 0.9), kind: 'find' });
  events.sort((a, b) => a.at - b.at);
  S.travel = { from: S.zone, to, p: 0, total: R.t * (1 - 0.08 * sk('speed')), events };
  sfx('march'); toast(`${ZONES[to].n}(으)로 출발했어요`); setView('map');
}
function travelStep(dt) {

    T.events.shift();
    if (ev.kind === 'ambush') {
      const zone = Math.random() < 0.6 ? T.to : T.from, Z = ZONES[zone], R = routeOf(T.from, T.to);
      toast('습격! 야생 공룡이 상단을 덮쳐요', 'warn'); sfx('roar');
      const n = 2 + (R.danger > 2 ? 1 : 0) + (Math.random() < 0.4 ? 1 : 0);
      setTimeout(() => startBattle({ kind: 'ambush', zone, foes: addRare(Array.from({ length: n }, () => ({ type: pick(Z.wild), lv: Math.max(1, Math.round((ZONES[T.from].lv + Z.lv) / 2 + rand(-1, 1))) })), zone, 0.12) }), 600);
    } else {
      const r = Math.random();
      if (r < 0.35) { const k = Math.round(rand(2, 5)); addCargo('parts', k); toast(`버려진 트럭을 뒤져 기계 부품 ${k}개를 찾았어요`, 'good'); }
      else if (r < 0.65) { const k = Math.round(rand(3, 6)); addCargo('water', k); toast(`깨끗한 샘을 찾아 물 ${k}통을 채웠어요`, 'good'); }
      else if (r < 0.85) { T.p = Math.min(0.97, T.p + 0.2); toast('떠돌이 생존자가 지름길을 알려 줬어요'); }
      else { const m = Math.round(rand(30, 90)); S.money += m; toast(`쓰러진 상인의 금고에서 ${m} 크레딧을 찾았어요`, 'good'); }
    }
  }
  if (T.p >= 1 && !T.events.length) {
    S.zone = T.to; S.travel = null; toast(`${ZONES[S.zone].n}에 도착했어요`, 'good'); sfx('arrive');

  }
}

/* ================================================================

let B = null, bSpeed = 1, bZoom = 1.3;

}

  $('bInfo').textContent = `적 ${opt.foes.length} · 아군 ${ours.length}`;
  for (const f of opt.foes) { S.dex[f.type] = Math.max(S.dex[f.type] || 0, 1); if (UNITS[f.type].rare && !f.boss) setTimeout(() => toast(`희귀종 발견: ${UNITS[f.type].n}!`, 'good'), 900); }

  const u = { id: B.idSeq++, side, type, lv, ref, boss, x, y, a: side ? Math.PI / 2 : -Math.PI / 2, hp: ref ? Math.min(ref.hp, st.hp) : st.hp, max: st.hp, atk: st.atk, def: st.def, size: st.size,

  const dests = Object.keys(ZONES).filter(z => z !== S.zone).map(z => { const R = routeOf(S.zone, z); return `<div class="row"><div class="info"><b>${ZONES[z].n}</b><small>이동 ${R.t}초 · 길의 위험 <span class="danger">${stars(Math.round(R.danger + 1))}</span> · 야생 Lv${ZONES[z].lv}~</small></div><button class="btn small primary" data-act="go" data-z="${z}" ${T ? 'disabled' : ''}>출발</button></div>`; }).join('');
  el.innerHTML = `${USE3D ? '<div id="mapHost"></div>' : '<canvas id="mapcv" width="720" height="600"></canvas>'}
    ${T ? `<div class="card travel"><b>${ZONES[T.from].n} → ${ZONES[T.to].n}</b><div class="bar"><i id="tBar" style="width:${T.p * 100}%"></i></div><small class="muted" style="color:var(--muted)">가는 길에 습격이나 뜻밖의 발견이 있을 수 있어요</small></div>` : `<h2>어디로 갈까요<small>지금 ${ZONES[S.zone].n}</small></h2><div class="card">${dests}</div>`}`;
  if (USE3D) { try { if (!M3) initMap3D(); $('mapHost').appendChild(M3.canvas); } catch (e) { USE3D = USE3D && !!G3; $('mapHost').outerHTML = '<canvas id="mapcv" width="720" height="600"></canvas>'; drawMap(); } }
  else drawMap();
}
function drawMap() {
  const cv = $('mapcv'); if (!cv) return;
  const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  g.fillStyle = '#2a231b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = pick(['rgba(70,58,40,.4)', 'rgba(40,32,24,.5)', 'rgba(110,96,70,.2)']); g.beginPath(); g.arc((i * 97.13) % w, (i * 57.31) % h, (i % 5) + 2, 0, 7); g.fill(); }
  const P = z => ({ x: ZONES[z].mx * w, y: ZONES[z].my * h });
  const looks = { plain: ['#8a7650', '#6a5a3c'], city: ['#6e7276', '#4a4c50'], swamp: ['#5a6a3a', '#3a4a26'] };
  for (const z of Object.keys(ZONES)) { const p = P(z), gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, w * 0.24); gr.addColorStop(0, looks[z][0]); gr.addColorStop(1, 'rgba(42,35,27,0)'); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, w * 0.24, 0, 7); g.fill(); }
  // ruins in the city, reeds in the swamp, grass on the plain
  const C = P('city'); for (let i = 0; i < 14; i++) { g.fillStyle = pick(['#55585c', '#3e4044', '#6a6e72']); const x = C.x + rand(-80, 80), y = C.y + rand(-60, 60), bw = rand(10, 24); g.fillRect(x, y, bw, rand(10, 30)); }
  const Sw = P('swamp'); for (let i = 0; i < 8; i++) { g.fillStyle = 'rgba(40,60,50,.7)'; g.beginPath(); g.ellipse(Sw.x + rand(-80, 80), Sw.y + rand(-50, 50), rand(14, 30), rand(6, 12), 0, 0, 7); g.fill(); }
  const Pl = P('plain'); g.strokeStyle = '#a89a5a'; for (let i = 0; i < 60; i++) { const x = Pl.x + rand(-100, 100), y = Pl.y + rand(-60, 60); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y - 6); g.stroke(); }
  g.setLineDash([10, 8]); g.lineWidth = 3;
  for (const k of Object.keys(ROUTES)) { const [a, b] = k.split('|'), A = P(a), Bp = P(b); g.strokeStyle = ROUTES[k].danger > 2 ? 'rgba(212,87,60,.7)' : 'rgba(227,168,67,.6)'; g.beginPath(); g.moveTo(A.x, A.y); g.quadraticCurveTo((A.x + Bp.x) / 2 + 30, (A.y + Bp.y) / 2 - 20, Bp.x, Bp.y); g.stroke(); }
  g.setLineDash([]);
  for (const z of Object.keys(ZONES)) {
    const p = P(z); g.fillStyle = z === S.zone && !S.travel ? '#d0743a' : '#ece3d4'; g.strokeStyle = '#1c1711'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(p.x, p.y - 14); g.lineTo(p.x + 12, p.y + 6); g.lineTo(p.x - 12, p.y + 6); g.closePath(); g.stroke(); g.fill();
    g.font = '400 28px "Black Han Sans", sans-serif'; g.textAlign = 'center'; g.lineWidth = 6; g.strokeText(ZONES[z].n, p.x, p.y + 40); g.fillText(ZONES[z].n, p.x, p.y + 40);
  }
  const T = S.travel;
  const at = T ? (() => { const A = P(T.from), Bp = P(T.to), t = T.p, cx = (A.x + Bp.x) / 2 + 30, cy = (A.y + Bp.y) / 2 - 20; return { x: (1 - t) ** 2 * A.x + 2 * (1 - t) * t * cx + t * t * Bp.x, y: (1 - t) ** 2 * A.y + 2 * (1 - t) * t * cy + t * t * Bp.y, a: Math.atan2(Bp.y - A.y, Bp.x - A.x) }; })() : { x: P(S.zone).x - 40, y: P(S.zone).y + 6, a: 0 };
  if (PORTRAIT.trike && PORTRAIT.trike.complete) { g.save(); g.translate(at.x, at.y); if (Math.cos(at.a) < 0) g.scale(-1, 1); g.drawImage(PORTRAIT.trike, -60, -60, 120, 92); g.restore(); }
  else drawDino(g, 'trike', at.x, at.y, at.a, 46, performance.now() / 300, { still: !T });
}
function renderHeader() {
  $('rMoney').textContent = fmt(S.money); $('rCargo').textContent = `${cargoUsed()}/${capacity()}`; $('rDay').textContent = S.day;
  $('sub').textContent = S.travel ? `${ZONES[S.travel.from].n} → ${ZONES[S.travel.to].n} 이동 중` : `${ZONES[S.zone].n} · 멸망 후 ${S.day}일차`;
}
function renderAll() { renderHeader(); if (view === 'town') renderTown(); if (view === 'party') renderParty(); if (view === 'map') renderMap(); }
function setView(v) { view = v; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); ['town', 'party', 'map'].forEach(k => $('v-' + k).hidden = k !== v); renderAll(); }

function addRare(foes, z, chance) {
  if (Math.random() < chance) foes[foes.length - 1].type = pick(ZONES[z].rare);
  return foes;
}
function huntFoes(z, tier) {
  const Z = ZONES[z];
  if (tier === 3) return [{ type: BOSSES[Z.boss].base, lv: Z.lv + 6, boss: Z.boss }, { type: pick(Z.wild), lv: Z.lv + 4 }, { type: pick(Z.wild), lv: Z.lv + 4 }];
  const n = tier === 1 ? 2 : 3 + (Math.random() < 0.5 ? 1 : 0), lv0 = tier === 1 ? Z.lv : Z.lv + 2;
  return addRare(Array.from({ length: n }, () => ({ type: pick(Z.wild), lv: lv0 + Math.round(rand(0, tier === 1 ? 1 : 2)) })), z, tier === 1 ? 0.1 : 0.35);
}
document.body.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, z = S.zone;
  if (act === 'buy') { const g = b.dataset.g; let n = b.dataset.n === 'max' ? 40 : +b.dataset.n, spent = 0; while (n-- > 0 && S.money >= price(z, g) && cargoUsed() < capacity()) { const p = price(z, g); S.money -= p; spent += p; S.cargo[g] = (S.cargo[g] || 0) + 1; S.press[z][g] += 0.025; } if (spent) { sfx('coin'); S.stats.trades++; } }
  else if (act === 'sell') { const g = b.dataset.g; let got = 0; while (S.cargo[g] > 0) { const p = sellPrice(z, g); S.money += p; got += p; S.cargo[g]--; S.press[z][g] = Math.max(0.4, S.press[z][g] - 0.022); } delete S.cargo[g]; S.stats.earned += got; gainCxp(got / 12); sfx('coin'); toast(`${GOODS[g].n}을 팔아 ${got} 크레딧`, 'good'); }
  else if (act === 'hire') { const t = b.dataset.t, D = UNITS[t]; if (S.money < D.cost) return; S.money -= D.cost; const u = addUnit(t, Math.max(1, ZONES[z].lv - 1), party().length < partyCap()); sfx('coin'); toast(`${D.n}을 고용했어요${u.inParty ? '' : ' (상단이 가득 차 대기)'}`, 'good'); }
  else if (act === 'aid') { for (const u of S.units) { const mh = maxHp(u); u.hp = Math.max(u.hp, Math.round(mh * 0.5)); u.ko = false; } toast('구호소에서 쉬고 모두 일어났어요', 'good'); sfx('arrive'); }
  else if (act === 'heal') { const cost = +b.dataset.cost; if (S.money < cost) return; S.money -= cost; for (const u of S.units) { u.hp = maxHp(u); u.ko = false; } toast('모두 푹 쉬었어요', 'good'); sfx('arrive'); }
  else if (act === 'dart') { const n = +b.dataset.n, cost = n === 5 ? 165 : 35; if (S.money < cost) return; S.money -= cost; S.darts += n; sfx('coin'); }
  else if (act === 'hunt') {
    const tier = +b.dataset.tier;
    if (!party().some(u => !u.ko && u.type !== 'leader') && party().find(u => u.type === 'leader').ko) { toast('싸울 수 있는 대원이 없어요. 여관에서 쉬세요', 'warn'); return; }
    const foes = huntFoes(z, tier); startBattle({ kind: 'hunt', zone: z, tier, foes, boss: tier === 3 ? ZONES[z].boss : null }); if (tier === 3) sfx('roar');
  }
  else if (act === 'toggle') { const u = S.units.find(x => x.id === +b.dataset.id); if (!u) return; if (!u.inParty && party().length >= partyCap()) { toast(`지금은 대장 포함 ${partyCap()}명까지예요. 상단 레벨을 올리면 늘어나요 (최대 12명)`); return; } u.inParty = !u.inParty; if (cargoUsed() > capacity()) toast('짐칸이 모자라요. 출발 전에 짐을 줄이세요', 'warn'); }
  else if (act === 'go') startTravel(b.dataset.z);
  else if (act === 'quest') {
    const q = S.quests[z][+b.dataset.i]; if (!q) return;
    if (q.type === 'deliver') { if ((S.cargo[q.g] || 0) < q.n) return; S.cargo[q.g] -= q.n; if (!S.cargo[q.g]) delete S.cargo[q.g]; } else if (q.prog < q.n) return;
    S.money += q.money; S.stats.earned += q.money; gainCxp(q.xp); S.quests[z].splice(+b.dataset.i, 1); sfx('coin'); toast(`의뢰 완료 · ${q.money} 크레딧`, 'good');
  }
  else if (act === 'craft') {
    const R = RECIPES[b.dataset.r], n = +b.dataset.n; if (S.jobs[z] || n < 1) return;
    if (S.money < R.fee * n || !Object.entries(R.in).every(([g, k]) => (S.cargo[g] || 0) >= k * n)) return;
    for (const [g, k] of Object.entries(R.in)) { S.cargo[g] -= k * n; if (!S.cargo[g]) delete S.cargo[g]; }
    S.money -= R.fee * n; S.jobs[z] = { r: b.dataset.r, left: n, total: n, t: 0 }; sfx('tap'); toast(`${R.n} ${n}회를 맡겼어요`);
  }
  else if (act === 'collect') {
    const o = S.out[z] || {}; let left = 0;
    for (const [g, k] of Object.entries(o)) { if (g === 'dart') { S.darts += k; o[g] = 0; } else { const got = addCargo(g, k); o[g] = k - got; left += k - got; } }
    sfx('coin'); toast(left ? `짐칸이 모자라 ${left}개는 공방에 남겨 뒀어요` : '완성품을 모두 찾았어요', left ? 'warn' : 'good');
  }
  else if (act === 'skill') { const k = b.dataset.k; if (S.sp < 1 || sk(k) >= SKILL_MAX) return; S.sp--; S.skills[k] = sk(k) + 1; sfx('capture'); }
  else if (act === 'unit') { unitModal(+b.dataset.id); return; }
  else if (act === 'gear') {
    const u = S.units.find(x => x.id === +b.dataset.id), key = b.dataset.k, item = key === 'gw' ? 'weapon' : 'armor', need = (u[key] || 0) + 1;
    if ((u[key] || 0) >= 3 || (S.cargo[item] || 0) < need) return;
    S.cargo[item] -= need; if (!S.cargo[item]) delete S.cargo[item]; const r = u.hp / maxHp(u); u[key] = need; u.hp = Math.round(maxHp(u) * r); sfx('capture'); save(); renderAll(); unitModal(u.id); return;
  }
  else if (act === 'promote') {
    const u = S.units.find(x => x.id === +b.dataset.id), P = PROMO[u.tier || 0];
    if (!P || u.lv < P.lv || S.clv < P.clv || S.money < P.cost) return;
    S.money -= P.cost; u.tier = (u.tier || 0) + 1; u.hp = maxHp(u); u.ko = false; sfx('win'); toast(`${unitName(u)}(으)로 ${UNITS[u.type].cls === 'dino' ? '성장' : '전직'}했어요`, 'good'); save(); renderAll(); unitModal(u.id); return;
  }
  else if (act === 'closeBattle') { closeBattle(); return; }
  else if (act === 'close') closeModal();
  else if (act === 'snd') { sndInit(); S.snd = (S.snd + 2) % 3; applySnd(); }
  save(); renderAll();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sfx('tap'); setView(b.dataset.v); } });
document.addEventListener('pointerdown', sndInit);
window.addEventListener('resize', () => { if (B) resizeBattle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ================================================================
   LOOP
   ================================================================ */
let last = performance.now(), acc = 0, uiAcc = 0, saveAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  tick(dt);
  if (B && !B.over) { acc += dt * bSpeed; let k = 0; while (acc >= 1 / 30 && k < 8) { bStep(1 / 30); acc -= 1 / 30; k++; } if (k >= 8) acc = 0; }
  if (B) renderBattle(dt);
  else if (view === 'map' && M3 && M3.canvas.isConnected) renderMap3D(dt);
  uiAcc += dt;
  if (uiAcc > 0.5) { uiAcc = 0; renderHeader(); if (view === 'map' && S.travel) { const bar = $('tBar'); if (bar) bar.style.width = (S.travel.p * 100) + '%'; drawMap(); } }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
}
S = load() || freshState();
if (!S.units || !S.units.length) freshState();
for (const u of S.units) { if (u.type === 'pachy') u.type = 'para'; if (u.type === 'sarco') u.type = 'stego'; }
S.clv = S.clv || 1; S.cxp = S.cxp || 0; S.sp = S.sp || 0; S.skills = S.skills || {}; S.jobs = S.jobs || {}; S.out = S.out || {}; S.quests = S.quests || {};
for (const z of Object.keys(ZONES)) for (const g of Object.keys(GOODS)) { if (S.drift[z][g] === undefined) S.drift[z][g] = 1; if (S.press[z][g] === undefined) S.press[z][g] = 1; }
ensureQuests();
S.dex = S.dex || {}; for (const u of S.units) if (UNITS[u.type].cls === 'dino') S.dex[u.type] = 2;
$('v-town').innerHTML = '<div id="loading"><b style="font-family:var(--f-display);font-size:20px;color:var(--rust)">공룡 상단</b><span id="loadTxt">공룡 모델 불러오는 중…</span></div>';
loadModels((n, t) => { const el = $('loadTxt'); if (el) el.textContent = `공룡 모델 불러오는 중 ${n}/${t}`; }).then(ok => {
  USE3D = ok;
  if (ok) { try { makePortraits(); } catch (e) { USE3D = false; } }
  setTimeout(() => setView('town'), 50);
});
if (S.stats.battles === 0) setTimeout(() => toast('잿빛 평원에서 시작해요 · 곡물을 싸게 사서 무너진 도시에 팔아 보세요'), 600);
window.__dino = { get S() { return S; }, get B() { return B; } };
requestAnimationFrame(frame);
})();
</script>
