<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17110b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>흙속왕국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: field-guide app — resource header, four tabs (colony sim, league battle, species guide, growth), full-screen battle overlay.
   Single deliberate earth-toned dark look; colors set explicitly. */
:root {
  --bg: #17110b; --panel: #221912; --panel-2: #2c2118; --line: #3d2e20;
  --text: #efe4d2; --muted: #a8957b; --amber: #e3a843; --red: #d4573c; --leaf: #93c06c; --honey: #f0b94a; --blue: #7fb6e0;
  --r-basic: #a8957b; --r-common: #d8cdb9; --r-rare: #79b4e4; --r-epic: #c58be6; --r-legend: #f0b94a;
  --f-display: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 13px; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button[disabled] { opacity: .45; pointer-events: none; }
#app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }

header { padding-block: 8px 6px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 19px; margin: 0; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: flex; gap: 5px; flex: none; }
.rc { display: flex; flex-direction: column; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px 7px; min-width: 46px; }
.rc em { font-style: normal; font-size: 9px; color: var(--muted); letter-spacing: .06em; }
.rc b { font-size: 13px; font-variant-numeric: tabular-nums; }
.rc.food b { color: var(--amber); } .rc.honey b { color: var(--honey); } .rc.troph b { color: var(--blue); }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 17px; margin: 0; text-wrap: balance; }
h2 small { font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--amber); color: #23170a; border-color: #b9842a; }
.btn.big { padding: 14px; font-size: 17px; font-family: var(--f-display); font-weight: 800; border-radius: 12px; width: 100%; }
.btn.small { padding: 6px 9px; font-size: 12px; border-radius: 8px; flex: none; }
.bar { height: 6px; background: #3a2a1d; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--leaf); width: 0; }
.bar.honey i { background: var(--honey); } .bar.blue i { background: var(--blue); }

/* colony */
.colony { display: flex; flex-direction: column; }
.ctool { display: flex; align-items: center; gap: 6px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.stats { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.stats::-webkit-scrollbar { display: none; }
.stat { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--text); font-size: 12px; margin-left: 3px; }
.tbtn { flex: none; height: 28px; padding: 0 9px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tbtn.on { border-color: var(--leaf); color: var(--leaf); }
.panes { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; position: relative; }
.pane { position: relative; min-height: 0; }
#surfPane { flex: 1.45; } #nestPane { flex: 1; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.tag { position: absolute; left: 8px; top: 6px; font-size: 10px; letter-spacing: .12em; color: rgba(239,228,210,.75); background: rgba(23,17,11,.55); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.hint { position: absolute; right: 8px; top: 6px; font-size: 10px; color: rgba(239,228,210,.6); pointer-events: none; }
#info { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(23,17,11,.86); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
#info b { font-weight: 600; flex: none; } #info .st { color: var(--muted); flex: 1; min-width: 0; }
#info .bar { width: 54px; flex: none; }
#panel { background: var(--panel); border-top: 1px solid var(--line); padding-block: 7px 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
.qrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.qrow .ql { font-size: 11px; color: var(--muted); flex: none; }
#queue { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; min-height: 24px; align-items: center; }
#queue::-webkit-scrollbar { display: none; }
.qchip { flex: none; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.qchip.first { border-color: var(--amber); } .qchip .x { color: var(--muted); }
#layStatus { font-size: 11px; color: var(--amber); flex: none; font-variant-numeric: tabular-nums; }
.castes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.caste { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 6px 6px; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.caste canvas { height: 30px; pointer-events: none; }
.caste .nm { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caste .co { font-size: 11px; color: var(--amber); font-variant-numeric: tabular-nums; }
.caste .ds { font-size: 10px; color: var(--muted); line-height: 1.3; }
.caste.locked { opacity: .6; } .caste.locked canvas { filter: brightness(0) opacity(.5); } .caste.locked .co { color: var(--muted); }
.caste.short .co { color: var(--red); }

/* league */
.tier { display: flex; align-items: center; gap: 12px; }
.badge { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 13px; text-align: center; line-height: 1.1; background: radial-gradient(circle at 35% 30%, #5b4430, #2a1d12); border: 2px solid var(--amber); }
.tier .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tier .tx b { font-family: var(--f-display); font-size: 18px; }
.tier .tx small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.deckrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.dslot { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 2px 5px; text-align: center; min-width: 0; }
.dslot canvas { height: 30px; }
.dslot span { display: block; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dslot small { display: block; font-size: 10px; color: var(--muted); }
.dslot.empty { border-style: dashed; color: var(--muted); display: grid; place-items: center; min-height: 58px; font-size: 11px; }
.chests { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chest { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 3px; text-align: center; min-height: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.chest canvas { width: 44px; height: 34px; }
.chest b { font-size: 11px; white-space: nowrap; }
.chest small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chest.ready { border-color: var(--honey); box-shadow: 0 0 0 2px rgba(240,185,74,.25); }
.chest.ready small { color: var(--honey); }
.chest.open small { color: var(--leaf); }
.chest.none { border-style: dashed; justify-content: center; color: var(--muted); font-size: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .info b { font-weight: 600; font-size: 13px; }
.row .info small { color: var(--muted); font-size: 11px; }
.row + .row { border-top: 1px dashed var(--line); padding-top: 10px; }

/* dex */
.dex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sp { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
.sp canvas { height: 44px; }
.sp .nm { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .rr { font-size: 10px; }
.sp .lv { position: absolute; top: 6px; right: 7px; font-size: 10px; font-weight: 600; background: var(--panel-2); border-radius: 6px; padding: 1px 5px; }
.sp .bar { margin-top: 3px; } .sp .sh { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sp.locked canvas { filter: brightness(0) opacity(.45); } .sp.locked .nm { color: var(--muted); }
.sp.up { border-color: var(--leaf); } .sp.up .sh { color: var(--leaf); }
.sp.indeck::after { content: "덱"; position: absolute; left: 7px; top: 6px; font-size: 9px; background: var(--amber); color: #23170a; border-radius: 5px; padding: 1px 4px; font-weight: 600; }
.r-기본 { color: var(--r-basic); } .r-일반 { color: var(--r-common); } .r-희귀 { color: var(--r-rare); } .r-영웅 { color: var(--r-epic); } .r-전설 { color: var(--r-legend); }

/* tabs */
#tabs { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 5px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); gap: 4px; }
#tabs button { flex: 1; border-radius: 10px; padding: 8px 2px; font-family: var(--f-display); font-weight: 800; font-size: 14px; color: var(--muted); position: relative; }
#tabs button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.dot { position: absolute; top: 2px; right: 14%; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: #fff; font-family: var(--f-body); font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

/* battle overlay */
#battle { position: absolute; inset: 0; z-index: 20; background: #120d08; display: flex; flex-direction: column; }
.bbar { display: flex; align-items: center; gap: 8px; padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.bbar .who { min-width: 0; flex: none; max-width: 42%; }
.bbar .who b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bbar .who small { font-size: 10px; color: var(--muted); }
.qhp { flex: 1; height: 10px; background: #3a2a1d; border-radius: 5px; overflow: hidden; position: relative; }
.qhp i { display: block; height: 100%; width: 100%; transition: width .2s; }
.qhp.enemy i { background: var(--red); } .qhp.mine i { background: var(--amber); }
#bTimer { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; flex: none; min-width: 40px; text-align: right; }
#bTimer.hot { color: var(--red); }
.bfield { flex: 1; min-height: 0; position: relative; }
#bBanner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--f-display); font-weight: 800; font-size: 24px; text-shadow: 0 2px 10px #000; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; white-space: nowrap; }
#bBanner.show { opacity: 1; }
.bfood { font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.bfood b { color: var(--amber); font-size: 16px; }
#bQueue { display: flex; gap: 3px; flex: none; align-items: center; min-width: 60px; }
#bQueue span { font-size: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 1px 5px; }
#bQueue span.first { border-color: var(--amber); }
.bcards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding-block: 4px 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.bcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 2px 5px; text-align: center; min-width: 0; position: relative; }
.bcard:active { transform: scale(.95); }
.bcard canvas { height: 30px; pointer-events: none; }
.bcard span { display: block; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcard b { display: block; font-size: 12px; color: var(--amber); font-variant-numeric: tabular-nums; }
.bcard.short { opacity: .5; } .bcard.short b { color: var(--red); }
.bcard .lvl { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); }

/* modal + toast */
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(10,7,4,.7); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; animation: pop .25s ease-out; }
.mcard h3 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; text-align: center; }
.mcard .sub { text-align: center; color: var(--muted); font-size: 12px; margin-top: -6px; }
.mcard .big-ic { height: 90px; }
.loot { display: flex; flex-direction: column; gap: 8px; }
.loot .row canvas { width: 56px; height: 30px; flex: none; }
.new { font-size: 10px; background: var(--leaf); color: #1a2410; border-radius: 5px; padding: 1px 5px; font-weight: 600; margin-left: 4px; }
.mbtns { display: flex; gap: 8px; } .mbtns .btn { flex: 1; }
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.statgrid div { background: var(--panel-2); border-radius: 8px; padding: 6px; text-align: center; }
.statgrid small { display: block; font-size: 10px; color: var(--muted); } .statgrid b { font-variant-numeric: tabular-nums; }
.statgrid b em { font-style: normal; color: var(--leaf); font-size: 11px; margin-left: 2px; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#toast { position: absolute; left: 50%; top: 58px; transform: translate(-50%, -6px); background: rgba(23,17,11,.94); border: 1px solid var(--line); color: var(--text); padding: 7px 14px; border-radius: 18px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; max-width: calc(100% - 24px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { border-color: var(--red); } #toast.good { border-color: var(--amber); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header>
    <div class="brand"><h1>흙속왕국</h1><small>일본왕개미 군집 · <i>Camponotus japonicus</i> · <span id="clock"></span></small></div>
    <div class="res">
      <span class="rc food"><em>먹이</em><b id="rFood">0</b></span>
      <span class="rc honey"><em>꿀</em><b id="rHoney">0</b></span>
      <span class="rc troph"><em>트로피</em><b id="rTroph">0</b></span>
    </div>
  </header>

  <main>
    <section class="view colony" id="v-colony">
      <div class="ctool">
        <div class="stats">
          <span class="stat">일개미<b id="sWorker">0</b></span><span class="stat">병정<b id="sSoldier">0</b></span>
          <span class="stat">알<b id="sEgg">0</b></span><span class="stat">애벌레<b id="sLarva">0</b></span><span class="stat">번데기<b id="sPupa">0</b></span><span class="stat">전사<b id="sDead">0</b></span>
        </div>
        <button class="tbtn on" id="phBtn" aria-pressed="true">페로몬</button>
        <button class="tbtn" id="spdBtn">×1</button>
      </div>
      <div class="panes">
        <div class="pane" id="surfPane">
          <canvas id="surf" aria-label="땅 위: 개미들이 먹이를 찾고 싸우는 모습"></canvas>
          <span class="tag">땅 위</span><span class="hint">드래그·확대 · 개미를 눌러 따라가기</span>
          <div id="info" hidden><b id="iName"></b><span class="st" id="iState"></span><span class="bar"><i id="iHp"></i></span></div>
        </div>
        <div class="pane" id="nestPane"><canvas id="nest" aria-label="땅속 단면: 저장고, 육아실, 여왕방"></canvas><span class="tag">땅속 단면</span></div>
      </div>
      <div id="panel">
        <div class="qrow"><span class="ql">여왕 산란</span><div id="queue"></div><span id="layStatus"></span></div>
        <div class="castes" id="castes"></div>
      </div>
    </section>

    <section class="view scroll" id="v-league" hidden>
      <div class="card">
        <div class="tier"><div class="badge" id="lBadge"></div>
          <div class="tx"><b id="lTier"></b><small id="lTroph"></small><div class="bar blue"><i id="lBar"></i></div><small id="lNext"></small></div></div>
        <button class="btn big primary" id="fightBtn">대전 시작</button>
        <small class="muted" id="lRecord"></small>
      </div>
      <h2>출전 덱<small>도감에서 바꿀 수 있어요</small></h2>
      <div class="deckrow" id="deckRow"></div>
      <h2>알집<small>대전에서 이기면 받아요 · 한 번에 하나씩 부화해요</small></h2>
      <div class="chests" id="chests"></div>
      <div class="card"><div class="row"><div class="info"><b>보급 알집</b><small id="freeTxt"></small></div><button class="btn small primary" id="freeBtn">받기</button></div></div>
    </section>

    <section class="view scroll" id="v-dex" hidden>
      <h2>출전 덱<small>일개미 + 전투개미 4종</small></h2>
      <div class="deckrow" id="deckRow2"></div>
      <h2>개미 도감<small id="dexCount"></small></h2>
      <div class="dex" id="dex"></div>
    </section>

    <section class="view scroll" id="v-grow" hidden>
      <h2>오늘의 임무<small id="mDate"></small></h2>
      <div class="card" id="missions"></div>
      <h2>굴 강화<small>군집에서 모은 먹이로 대전 능력을 키워요</small></h2>
      <div class="card" id="nestUps"></div>
      <h2>기록</h2>
      <div class="card" id="records"></div>
    </section>
  </main>

  <nav id="tabs">
    <button data-v="colony" class="on">군집</button>
    <button data-v="league">대전<span class="dot" id="dotLeague" hidden></span></button>

const homeP = new Float32Array(GW * GH), foodP = new Float32Array(GW * GH);
const gi = (x, y) => { const cx = x / CELL | 0, cy = y / CELL | 0; return (cx < 0 || cy < 0 || cx >= GW || cy >= GH) ? -1 : cy * GW + cx; };

  const d = a.len * 1.4 + 7, sp = 0.6;

  const r = sense(g, a.x + Math.cos(a.a + sp) * d, a.y + Math.sin(a.a + sp) * d);

const NODES = {

const ADJ = {}; Object.keys(NODES).forEach(k => ADJ[k] = []);

function route(from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const n = q.shift(); if (n === to) break; for (const m of ADJ[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }

function newColony() {
  G = { t: 0, food: 40, ants: [], brood: [], foes: [], items: [], corpses: [], midden: [], alarms: [],

  } else { const amt = 12 + (Math.random() * 10 | 0); G.items.push({ kind: 'sugar', x: cx, y: cy, a: 0, amt, max: amt, val: 2 }); }
}
function spawnFoe(type) {

  const x = edge === 0 ? 10 : edge === 1 ? W - 10 : rand(40, W - 40), y = edge === 2 ? 10 : edge === 3 ? H - 10 : rand(40, H - 40);
  const D = FOES[type];
  const mk = (ox, oy) => ({ type, x: x + ox, y: y + oy, a: angTo(x, y, NEST.x, NEST.y) + rand(-0.6, 0.6), hp: D.hp, leg: rand(0, 6), life: D.life, turn: 0, alarmCd: 0, moving: true });

      const k = b.dataset.sp, i = M.deck.indexOf(k);
      if (i >= 0) M.deck[i] = null;
      else { const e2 = M.deck.indexOf(null); if (e2 < 0) { toast('덱이 가득 찼어요. 먼저 한 종을 빼 주세요'); return; } M.deck[e2] = k; }
      saveMeta(); closeModal(); renderAll();
    } else if (act === 'claim') {
      const m = M.missions.list[+b.dataset.i], P = MISSION_POOL.find(p => p.k === m.k);
      if (m.claimed || m.prog < P.goal) return;
      m.claimed = true; M.honey += P.honey; saveMeta(); toast(`꿀 +${P.honey}`, 'good'); renderAll();
    } else if (act === 'bonus') {
      if (M.missions.bonus || !M.missions.list.every(m => m.claimed)) return;
      M.missions.bonus = true; const slot = M.chests.findIndex(c => !c);
      if (slot >= 0) { M.chests[slot] = { type: 'big', start: null }; toast('큰 알집을 받았어요', 'good'); } else { M.honey += 60; toast('꿀 +60', 'good'); }
      saveMeta(); renderAll();
    } else if (act === 'nest') {
      const k = b.dataset.k, lv = M.nest[k], cost = nestCost(k, lv);
      if (lv >= NEST_MAX || G.food < cost.food || M.honey < cost.honey) return;
      G.food -= cost.food; M.honey -= cost.honey; M.nest[k]++; saveMeta(); saveColony();
      toast(`${NEST_UPS[k].n} Lv${M.nest[k]}`, 'good'); renderAll();
    } else if (act === 'reset') {
      if (Date.now() - resetArmed < 3000) {
        M = freshMeta(); newColony(); homeP.fill(0); foodP.fill(0); saveMeta(); saveColony(); sel = null; toast('새 군집을 시작했어요'); setView('colony'); resetArmed = 0; return;
      }
      resetArmed = Date.now(); b.textContent = '한 번 더 누르면 모든 기록이 지워져요';
    }
  });
  window.addEventListener('resize', () => { resizeColony(); if (BT) resizeBattle(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveMeta(); saveColony(); } });
  window.addEventListener('pagehide', () => { saveMeta(); saveColony(); });
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), acc = 0, bAcc = 0, uiAcc = 0, saveAcc = 0;
function renderLeagueChestsOnly() {
  $('chests').querySelectorAll('.chest[data-i]').forEach(el => {
    const c = M.chests[+el.dataset.i]; if (!c) return; const st = chestState(c);
    if (st === 'opening') el.querySelector('small').textContent = fmtT(chestLeft(c));
    else if (st === 'ready' && !el.classList.contains('ready')) renderLeague();
  });
}
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  if (raw > 3) { const g = colonyCatchUp(raw); if (g > 0) toast(`자리를 비운 동안 먹이 +${fmt(g)}`); }
  const dt = Math.min(0.1, raw);
  const colonyVisible = view === 'colony' && !BT;
  acc += dt * (colonyVisible ? speed : 1);
  let n = 0;
  while (acc >= STEP && n < 12) { colonyStep(STEP); acc -= STEP; n++; }
  if (n >= 12) acc = 0;
  if (BT && !BT.over) { bAcc += dt; let k = 0; while (bAcc >= STEP && k < 6) { bStep(STEP); bAcc -= STEP; k++; } if (k >= 6) bAcc = 0; }
  else if (BT && BT.banner > 0) { BT.banner -= dt; if (BT.banner <= 0) $('bBanner').classList.remove('show'); }
  if (colonyVisible && sw) {
    if (sel && sel.dead) sel = null;
    if (sel && sel.loc === 'surface') { cam.x += (sel.x - cam.x) * 0.12; cam.y += (sel.y - cam.y) * 0.12; clampCam(); }
    renderSurface(); renderNest();
  }
  if (BT) renderBattle();
  uiAcc += dt;
  if (uiAcc > 0.25) {
    uiAcc = 0; renderHeader();
    if (colonyVisible) renderColonyUi();
    if (BT) renderBattleUi();
    if (view === 'league' && !BT) { updateFree(); renderLeagueChestsOnly(); }
  }
  saveAcc += dt; if (saveAcc > 10) { saveAcc = 0; saveMeta(); saveColony(); }
  requestAnimationFrame(frame);
}
function boot() {
  M = loadMeta(); ensureMissions();
  const saved = loadJSON(SAVE_COL);
  if (saved && saved.ants) { G = saved; G.alarms = G.alarms || []; }
  else newColony();
  bindColony(); bindMeta();
  setView('colony');
  const away = saved ? (Date.now() - (saved.saved || Date.now())) / 1000 : 0;
  if (away > 30) { const g = colonyCatchUp(away); setTimeout(() => toast(`${fmtT(Math.min(away, 6 * 3600))} 동안 군집이 먹이 ${fmt(g)}을 모았어요`, 'good'), 600); }
  else if (!saved) setTimeout(() => toast('일개미들이 먹이를 찾기 시작했어요 · 대전 탭에서 다른 군집과 겨뤄 보세요'), 600);
  requestAnimationFrame(frame);
}
boot();
window.__heuksok = { get BT() { return BT; }, get M() { return M; }, get G() { return G; } };
})();
</script>
